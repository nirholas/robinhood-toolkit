# robinhood-toolkit · Foundry config for ToolkitToken
# Author: nirholas · https://github.com/nirholas/robinhood-toolkit
# License: MIT (c) 2026 nirholas

[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.26"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
remappings = ["@openzeppelin/=lib/openzeppelin-contracts/"]

# RPC aliases. `--rpc-url rh_testnet` / `rh_mainnet` resolve to these.
[rpc_endpoints]
rh_testnet = "https://rpc.testnet.chain.robinhood.com"
rh_mainnet = "https://rpc.mainnet.chain.robinhood.com"

# Blockscout verification. `--verify --verifier blockscout` uses these.
# Blockscout ignores the API key value, but --etherscan-api-key must be
# non-empty, so any placeholder works.
[etherscan]
rh_testnet = { key = "blockscout", chain = 46630, url = "https://explorer.testnet.chain.robinhood.com/api/" }
rh_mainnet = { key = "blockscout", chain = 4663, url = "https://robinhoodchain.blockscout.com/api/" }
