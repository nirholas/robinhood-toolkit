[profile.default]
src = "src"
out = "out"
libs = ["lib"]

# Pin build settings so Blockscout verification is reproducible.
# If verification ever complains about a mismatch, match these exactly.
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

[rpc_endpoints]
rh_testnet = "https://rpc.testnet.chain.robinhood.com"
rh_mainnet = "https://rpc.mainnet.chain.robinhood.com"

# Blockscout verifier endpoints (no API key required).
[etherscan]
rh_testnet = { key = "blockscout", chain = 46630, url = "https://explorer.testnet.chain.robinhood.com/api/" }
rh_mainnet = { key = "blockscout", chain = 4663, url = "https://robinhoodchain.blockscout.com/api/" }
